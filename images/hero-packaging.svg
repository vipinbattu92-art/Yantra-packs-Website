  <line x1="522" y1="0"  x2="522" y2="440" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <line x1="468" y1="8"  x2="468" y2="440" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <line x1="418" y1="28" x2="418" y2="440" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Right wall shelf items -->
  <rect x="536" y="52"  width="40" height="34" rx="2" fill="rgba(255,255,255,0.16)"/>
  <rect x="480" y="56"  width="40" height="30" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="536" y="136" width="40" height="34" rx="2" fill="rgba(255,255,255,0.13)"/>
  <rect x="480" y="140" width="32" height="30" rx="2" fill="rgba(255,255,255,0.10)"/>
  <rect x="536" y="220" width="40" height="34" rx="2" fill="rgba(255,255,255,0.10)"/>
  <rect x="480" y="224" width="32" height="30" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="536" y="304" width="40" height="34" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="480" y="308" width="32" height="30" rx="2" fill="rgba(255,255,255,0.05)"/>

  <!-- === SMALL BACKGROUND CONTAINER (near VP) === -->
  <rect x="252" y="196" width="76" height="58" rx="3" fill="rgba(255,255,255,0.16)"/>
  <polygon points="252,196 296,172 328,196" fill="rgba(255,255,255,0.28)"/>
  <polygon points="328,196 346,172 346,252 328,254" fill="rgba(0,0,0,0.14)"/>
  <rect x="260" y="212" width="44" height="22" rx="2" fill="rgba(255,255,255,0.82)"/>
  <text x="282" y="226" text-anchor="middle" fill="#0A5FA3" font-family="monospace" font-size="8" font-weight="900">RFID</text>

  <!-- === LEFT FOREGROUND CONTAINER === -->
  <!-- Front face -->
  <rect x="8" y="265" width="194" height="150" rx="5" fill="url(#cf)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <!-- Top face -->
  <polygon points="8,265 202,265 226,235 32,235" fill="url(#ct)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <!-- Right side face -->
  <polygon points="202,265 226,235 226,356 202,415" fill="url(#cs)" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>
  <!-- Horizontal ribs -->
  <line x1="8"   y1="298" x2="202" y2="298" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <line x1="8"   y1="331" x2="202" y2="331" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <line x1="8"   y1="364" x2="202" y2="364" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <!-- Vertical ribs -->
  <line x1="73"  y1="265" x2="73"  y2="415" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="138" y1="265" x2="138" y2="415" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- RFID label -->
  <rect x="30" y="278" width="96" height="46" rx="3" fill="rgba(255,255,255,0.93)"/>
  <text x="78" y="290" text-anchor="middle" fill="#00627A" font-family="monospace" font-size="6" font-weight="700" letter-spacing="0.5">YANTRA PACKS</text>
  <text x="78" y="305" text-anchor="middle" fill="#0D2B45" font-family="monospace" font-size="13" font-weight="900">RFID</text>
  <text x="78" y="317" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="7">YP-C-00142</text>
  <!-- RFID signal waves -->
  <circle cx="168" cy="290" r="6"  fill="none" stroke="rgba(255,255,255,0.60)" stroke-width="1.8"/>
  <circle cx="168" cy="290" r="12" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <circle cx="168" cy="290" r="19" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
  <circle cx="168" cy="290" r="3"  fill="rgba(255,255,255,0.90)"/>
  <!-- Pallet base -->
  <rect x="0"  y="413" width="234" height="13" rx="3" fill="rgba(255,255,255,0.17)"/>
  <line x1="73"  y1="413" x2="73"  y2="426" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <line x1="138" y1="413" x2="138" y2="426" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <rect x="0"  y="424" width="234" height="6"  rx="2" fill="rgba(255,255,255,0.10)"/>

  <!-- === MAIN CENTER-RIGHT CONTAINER (largest) === -->
  <!-- Front face -->
  <rect x="260" y="250" width="230" height="158" rx="5" fill="url(#cf)" stroke="rgba(255,255,255,0.24)" stroke-width="1.2"/>
  <!-- Top face -->
  <polygon points="260,250 490,250 516,216 286,216" fill="url(#ct)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Right side face -->
  <polygon points="490,250 516,216 516,360 490,408" fill="url(#cs)" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <!-- Horizontal ribs -->
  <line x1="260" y1="283" x2="490" y2="283" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <line x1="260" y1="316" x2="490" y2="316" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <line x1="260" y1="349" x2="490" y2="349" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <!-- Vertical ribs -->
  <line x1="337" y1="250" x2="337" y2="408" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="413" y1="250" x2="413" y2="408" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- Main RFID label -->
  <rect x="282" y="264" width="108" height="52" rx="3" fill="rgba(255,255,255,0.94)"/>
  <text x="336" y="276" text-anchor="middle" fill="#00627A" font-family="monospace" font-size="6.5" font-weight="700" letter-spacing="0.5">YANTRA PACKS</text>
  <text x="336" y="293" text-anchor="middle" fill="#0D2B45" font-family="monospace" font-size="14" font-weight="900">RFID</text>
  <text x="336" y="307" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="7.5">YP-C-00087</text>
  <!-- RFID signal waves -->
  <circle cx="462" cy="270" r="7"  fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>
  <circle cx="462" cy="270" r="14" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.3"/>
  <circle cx="462" cy="270" r="21" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="0.8"/>
  <circle cx="462" cy="270" r="3.5" fill="rgba(255,255,255,0.95)"/>
  <!-- Pallet base -->
  <rect x="250" y="406" width="276" height="13" rx="3" fill="rgba(255,255,255,0.17)"/>
  <line x1="337" y1="406" x2="337" y2="419" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <line x1="413" y1="406" x2="413" y2="419" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <rect x="250" y="417" width="276" height="6"  rx="2" fill="rgba(255,255,255,0.10)"/>

  <!-- === DATA BADGES === -->
  <!-- Live tracking badge (top-right) -->
  <rect x="388" y="18" width="178" height="72" rx="10" fill="rgba(6,25,55,0.62)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="407" cy="40" r="5"   fill="#00C48C"/>
  <circle cx="407" cy="40" r="9.5" fill="none" stroke="rgba(0,196,140,0.38)" stroke-width="1.5"/>
  <text x="422" y="45" fill="rgba(255,255,255,0.95)" font-family="Arial,sans-serif" font-size="10.5" font-weight="700">LIVE TRACKED</text>
  <text x="407" y="61" fill="rgba(200,230,255,0.65)" font-family="Arial,sans-serif" font-size="9">2,847 assets active now</text>
  <text x="407" y="77" fill="#00C48C" font-family="Arial,sans-serif" font-size="9.5" font-weight="700">99.2% recovery rate</text>

  <!-- Stats badge (top-left) -->
  <rect x="12" y="18" width="152" height="52" rx="9" fill="rgba(6,25,55,0.58)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="32" y="42" fill="rgba(255,255,255,0.96)" font-family="Arial,sans-serif" font-size="20" font-weight="900">200+</text>
  <text x="85" y="38" fill="rgba(200,230,255,0.58)" font-family="Arial,sans-serif" font-size="8.5">trips per</text>
  <text x="85" y="51" fill="rgba(200,230,255,0.58)" font-family="Arial,sans-serif" font-size="8.5">asset lifecycle</text>

  <!-- Bottom depth overlay -->
  <rect width="580" height="440" fill="url(#bo)"/>
</svg>
