<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C48C"/>
      <stop offset="52%" stop-color="#1BA9DE"/>
      <stop offset="100%" stop-color="#0A5FA3"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="60" cy="60" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(0,255,180,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,255,180,0)"/>
    </radialGradient>
    <linearGradient id="cf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="ct" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.50)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.22)"/>
    </linearGradient>
    <linearGradient id="cs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)"/>
    </linearGradient>
    <linearGradient id="bo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,20,50,0.40)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="580" height="440" fill="url(#bg)"/>
  <rect width="580" height="440" fill="url(#glowTL)"/>

  <!-- === CORRIDOR PERSPECTIVE (VP: 290, 152) === -->
  <!-- Floor polygon -->
  <polygon points="0,440 580,440 352,152 228,152" fill="rgba(255,255,255,0.08)"/>
  <!-- Floor radiating lines -->
  <line x1="290" y1="152" x2="0"   y2="440" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="290" y1="152" x2="115" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="290" y1="152" x2="228" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="290" y1="152" x2="580" y2="440" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="290" y1="152" x2="465" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="290" y1="152" x2="352" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Floor horizontal cross-lines -->
  <line x1="0"  y1="388" x2="580" y2="388" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="35" y1="348" x2="545" y2="348" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="95" y1="308" x2="485" y2="308" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- === LEFT WALL === -->
  <polygon points="0,0 0,440 228,152" fill="rgba(0,0,0,0.13)"/>
  <!-- Shelf horizontal bars (converge to VP) -->
  <line x1="0" y1="88"  x2="228" y2="152" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <line x1="0" y1="172" x2="228" y2="152" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="0" y1="256" x2="228" y2="152" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <line x1="0" y1="340" x2="228" y2="152" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <!-- Vertical shelf posts -->
  <line x1="0"   y1="0" x2="0"   y2="440" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <line x1="58"  y1="0" x2="58"  y2="440" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <line x1="112" y1="8" x2="112" y2="440" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <line x1="162" y1="28" x2="162" y2="440" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Left wall shelf items -->
  <rect x="4"  y="52"  width="40" height="34" rx="2" fill="rgba(255,255,255,0.18)"/>
  <rect x="48" y="56"  width="40" height="30" rx="2" fill="rgba(255,255,255,0.13)"/>
  <rect x="4"  y="136" width="40" height="34" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="48" y="140" width="32" height="30" rx="2" fill="rgba(255,255,255,0.11)"/>
  <rect x="4"  y="220" width="40" height="34" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="48" y="224" width="32" height="30" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="4"  y="304" width="40" height="34" rx="2" fill="rgba(255,255,255,0.09)"/>
  <rect x="48" y="308" width="32" height="30" rx="2" fill="rgba(255,255,255,0.06)"/>

  <!-- === RIGHT WALL === -->
  <polygon points="580,0 580,440 352,152" fill="rgba(0,0,0,0.08)"/>
  <!-- Shelf horizontal bars -->
  <line x1="580" y1="88"  x2="352" y2="152" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
  <line x1="580" y1="172" x2="352" y2="152" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
  <line x1="580" y1="256" x2="352" y2="152" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="580" y1="340" x2="352" y2="152" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Vertical shelf posts -->
